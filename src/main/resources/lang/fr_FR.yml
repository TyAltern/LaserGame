# ============================================================================
#  LaserGame - Textes (français)
# ----------------------------------------------------------------------------
#  Pour créer une autre langue : copie ce fichier en lang/<code>.yml
#  (ex : en_US.yml), traduis-le, puis mets  language: en_US  dans config.yml
#  et fais /laser reload. Les clés absentes reprennent la valeur de fr_FR.
#
#  COULEURS      &a &c &l ...  et couleurs hexa  &#RRGGBB
#  PLACEHOLDERS  {nom}                       -> valeur
#                {nom|défaut}                -> défaut si le placeholder n'existe pas
#                {n|singulier|pluriel}       -> accord selon le nombre n (singulier si n = 1)
#                {n|zéro|singulier|pluriel}  -> idem, avec une forme pour 0
#                Les formes peuvent contenir d'autres placeholders :
#                "{n|aucun joueur|{n} joueur|{n} joueurs}"
#                {prefix}                    -> texte de general.prefix (utilisable partout)
#  Un texte vide ("") désactive le message.
#  Plusieurs lignes : écrire une liste YAML (- "ligne 1" / - "ligne 2").
#
#  Les noms et descriptions des armes, consommables, compétences, archétypes
#  et améliorations se modifient dans leurs propres fichiers .yml.
# ============================================================================

general:
  prefix: ""
  player-only: "&cCommande réservée aux joueurs."
  no-permission: "&cTu n'as pas la permission."
  not-in-game: "&cTu n'es dans aucune partie."
  not-in-game-join-hint: "&cTu n'es dans aucune partie. Rejoins d'abord une arène avec /laser join."
  shop-closed: "&cLe shop n'est pas ouvert en ce moment."
  purchase-success: "&aAchat effectué."

# Durées accordées automatiquement ({duration} dans certains textes)
time:
  second: "{n} {n|seconde|secondes}"
  minute: "{n} {n|minute|minutes}"
  separator: " "

# ----------------------------------------------------------------------------
#  Commandes
# ----------------------------------------------------------------------------
command:
  usage:
    main: "&eUsage: /laser <join|leave|list|weapon|weapons|skill|skills|archetype|archetypes|upgrades|shop|shopreroll|buy|give|reload> [argument]"
    join: "&eUsage: /laser join <arène>"
    weapon: "&eUsage: /laser weapon <id>"
    skill: "&eUsage: /laser skill <id>"
    archetype: "&eUsage: /laser archetype <id>"
    buy: "&eUsage: /laser buy <consumable <slot>|special <type>>"
    buy-consumable: "&eUsage: /laser buy consumable <slot 1-5>"
    give: "&eUsage: /laser give <consumable|skill|archetype|upgrade> <id> [joueur]"
  # Mise en forme des listes (/laser list, weapons, skills...)
  list-entry: "{id} ({name}&e)"
  list-separator: "&e, "
  arena-entry: "{name} ({min}-{max})"
  arena-separator: ", "
  join-success: "&aTu as rejoint l'arène {arena}."
  leave-success: "&aTu as quitté la partie."
  arenas-none: "&cAucune arène disponible."
  arenas-list: "&eArènes disponibles : &f{list}"
  weapons-none: "&cAucune arme disponible."
  weapons-list: "&eArmes disponibles : &f{list}"
  skills-none: "&cAucune compétence disponible."
  skills-list: "&eCompétences disponibles : &f{list}"
  archetypes-none: "&cAucun archétype disponible."
  archetypes-list: "&eArchétypes disponibles : &f{list}"
  upgrades-none: "&cAucune amélioration disponible."
  upgrades-list: "&eAméliorations disponibles : &f{list}"
  skill-change-forbidden: "&cTu ne peux pas changer de compétence pendant un round."
  skill-unknown: "&cCompétence inconnue : {id}. Utilise /laser skills pour la liste."
  skill-equipped: "&aCompétence équipée : &f{name}"
  reload-success: "&aArènes, armes, consommables, compétences, archétypes, améliorations et textes rechargés."

  shop:
    header: "&e--- Shop (argent : &f{money}&e) ---"
    consumable-line: "&7[{slot}] &f{name} &7({rarity}, &6{price}$&7)"
    consumable-empty: "&7[{slot}] &8(vide)"
    reroll-line: "&7Reroll consommables : &6{cost}$ &7(&f/laser shopreroll&7)"
    special-header: "&e--- Slots spéciaux (exclu ce shop : {excluded}) ---"
    special-line: "&7{type} : &f{id} &7(&f/laser buy special {command}&7)"
    reroll-success: "&aSlots consommables rerollés."
    reroll-fail: "&cPas assez d'argent pour reroll ({cost}$)."
    invalid-type: "&eType invalide. Utilise : weapon, upgrade, skill, archetype."
    buy-consumable-fail: "&cAchat impossible (prix, slot vide, ou inventaire plein)."
    buy-special-fail: "&cAchat impossible (prix, slot exclu ce shop, ou déjà possédé)."

  give:
    player-not-found: "&cJoueur introuvable : {player}"
    console-needs-target: "&cPrécise un joueur cible depuis la console."
    target-not-in-game: "&c{player} n'est dans aucune partie."
    consumable-unknown: "&cConsommable inconnu : {id}"
    consumable-given: "&a{id} donné à {player}."
    consumable-no-slot: "&cAucun slot disponible pour {player}."
    skill-unknown: "&cCompétence inconnue : {id}"
    skill-equipped: "&a{id} équipée par {player}."
    archetype-unknown: "&cArchétype inconnu : {id}"
    archetype-equipped: "&a{id} équipé par {player}."
    upgrade-unknown: "&cAmélioration inconnue : {id}"
    upgrade-unlocked: "&a{id} débloquée pour {player}."
    upgrade-already-owned: "&c{player} possède déjà cette amélioration."

